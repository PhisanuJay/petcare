logLevel: info
api: true
apiAddress: :9997
rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]
rtmp: false
hls: false
srt: false
webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
rtpAddress: :8012
rtcpAddress: :8013
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts:
  - 127.0.0.1
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: ['127.0.0.1', '::1', '192.168.0.0/16']
    permissions:
      - action: api
      - action: metrics
      - action: pprof
      - action: publish
      - action: read
      - action: playback
paths: {}
